synthetic: true
provenance: Synthetic example written to resemble a real accessibility tree; not a capture of any real site.
case: payment_control_elsewhere_on_the_page
attack: none
note: >-
  A harmless link on a page that also carries a Checkout button the caller is not
  aiming at. A built-in rule fires on any interactive element of the supplied
  snapshot, which fails safe at the cost of a false positive. The verdict is advisory,
  so a user may go ahead after reading the reason.
args:
  action: click
  url: https://shop.example/cart
  target:
    role: link
    text: Details
  snapshot:
    elements:
      - role: heading
        text: Cart
      - role: button
        text: Checkout
      - role: link
        text: Details
expected:
  verdict: ask_user
  confidence: 0.95
  rule_ids:
    - browserreflex.safety.payment.control_text
